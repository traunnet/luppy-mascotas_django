{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Autenticación{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'ico/image.ico' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div style="position: absolute; top: 20px; left: 20px; z-index: 1000;">
        <a href="javascript:history.back()" class="btn btn-outline-light btn-sm shadow-sm">
            ← Volver
        </a>
    </div>
    </nav>

    <div class="auth-wrapper">
        <div id="auth-bg" class="auth-bg"></div>

        {% block contenido %}{% endblock %}
    </div>

    <footer class="footer-tech text-center py-3">
        <div>
            <a href="#">Política de Privacidad</a> |
            <a href="#">Aviso Legal</a> |
            <a href="#">Cookies</a>
        </div>
        <div class="mt-2 text-muted">
            <p  style="color: white;">&copy; Luppy & Sus Mascotas 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/auth.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
