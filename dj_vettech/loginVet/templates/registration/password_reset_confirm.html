{% extends "base_auth.html" %}
{% block contenido %}
<div class="auth-card">
    <h2 class="auth-title">Nueva Contraseña</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-auth w-100">Cambiar contraseña</button>
    </form>
</div>
{% endblock %}
